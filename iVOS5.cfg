
!
hostname iosv5
!
boot-start-marker
boot-end-marker
!
!
interface Loopback0
 no shutdown
 ip address 10.255.0.5 255.255.255.255
 ip ospf 1 area 0
!
interface Loopback100
 no shutdown
 description Simulated customer LAN
 ip address 192.168.5.1 255.255.255.0
!
interface GigabitEthernet0/0
 no shutdown
 description to isov1
 ip address 10.0.15.2 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/1
 no shutdown
 description to isov2
 ip address 10.0.25.2 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/2
 no shutdown
 no ip address
 shutdown
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/3
 no shutdown
 no ip address
 shutdown
 duplex auto
 speed auto
 media-type rj45
!
router ospf 1
 router-id 10.255.0.5
!
router bgp 65001
 bgp router-id 10.255.0.5
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 10.255.0.1 remote-as 65001
 neighbor 10.255.0.1 update-source Loopback0
 neighbor 10.255.0.2 remote-as 65001
 neighbor 10.255.0.2 update-source Loopback0
 !
 address-family ipv4
  network 192.168.5.0
  neighbor 10.255.0.1 activate
  neighbor 10.255.0.2 activate
 exit-address-family
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
!
end
