
!
version 15.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname iosv2
!
!
!
!
interface Loopback0
 no shutdown
 ip address 10.255.0.2 255.255.255.255
 ip ospf 1 area 0
!
interface GigabitEthernet0/0
 no shutdown
 ip address 10.0.12.2 255.255.255.252
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/1
 no shutdown
 description to ivos2
 ip address 10.0.23.1 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/2
 no shutdown
 description to iosv4
 ip address 10.0.24.1 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/3
 no shutdown
 description to iosv5
 ip address 10.0.25.1 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0
 duplex auto
 speed auto
 media-type rj45
!
router ospf 1
 router-id 10.255.0.2
!
router bgp 65001
 bgp router-id 10.255.0.2
 bgp cluster-id 1.1.1.1
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor CLIENTS peer-group
 neighbor CLIENTS remote-as 65001
 neighbor CLIENTS update-source Loopback0
 neighbor 10.255.0.1 remote-as 65001
 neighbor 10.255.0.1 update-source Loopback0
 neighbor 10.255.0.3 peer-group CLIENTS
 neighbor 10.255.0.4 peer-group CLIENTS
 neighbor 10.255.0.5 peer-group CLIENTS
 neighbor 10.255.0.6 peer-group CLIENTS
 !
 address-family ipv4
  neighbor CLIENTS route-reflector-client
  neighbor 10.255.0.1 activate
  neighbor 10.255.0.3 activate
  neighbor 10.255.0.4 activate
  neighbor 10.255.0.5 activate
  neighbor 10.255.0.6 activate
 exit-address-family
!
end
